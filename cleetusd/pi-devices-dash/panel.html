<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1024,height=600,initial-scale=1,user-scalable=no">
<title>Studio Panel</title>
<!--
  The Pi's main panel (1024x600, DZX Z3). Clock, room control, RuView, markets.
  Look: dragonfly.xyz (black field, one hot orange, light Roman serif display,
  tiny mono labels, ASCII imagery, crosshair marks) crossed with the DeerFlow
  card grid and F1-telemetry segmented bars.

  Everything the old Room panel guarded is still guarded here: the server
  refuses protected writes, the page says why; confirm tiles arm-then-fire;
  rows settle on the READBACK; and the control board dims hard with a banner
  once its data is older than 60 s, because confident stale outlet states on a
  wall are worse than none. The old page is at /classic.
-->
<style>
  @font-face{font-family:"Newsreader";src:url(/fonts/Newsreader-normal.woff2) format("woff2");font-weight:200 400;font-display:block}
  @font-face{font-family:"Doto";src:url(/fonts/Doto-normal.woff2) format("woff2");font-weight:400 900;font-display:block}
  @font-face{font-family:"Geist Mono";src:url(/fonts/GeistMono-normal.woff2) format("woff2");font-weight:300 500;font-display:block}
  :root{
    --void:#000; --card:#0a0a0a; --card2:#101010; --edge:#1d1d1d; --edge2:#2a2a2a;
    --bone:#ecebe7; --dim:#7b7b7b; --dim2:#4a4a4a; --ghost:#262626;
    --hot:#fa4c14; --hot2:#ff7a45; --hotbg:#1c0c05; --hotedge:#5a2410;
    --serif:"Newsreader",Georgia,serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace; --dot:"Doto","Geist Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:1024px;height:600px;overflow:hidden;touch-action:manipulation;background:var(--void)}
  body{color:var(--bone);font-family:var(--mono);font-size:11px;user-select:none;position:relative}

  /* ── Frame: dragonfly's corner letters and crosshairs ─────────────────── */
  .corner{position:absolute;font-family:var(--serif);font-weight:300;font-size:22px;line-height:1;color:var(--bone);z-index:2}
  .corner.tl{left:12px;top:9px} .corner.tr{right:12px;top:9px}
  .corner.bl{left:12px;bottom:6px} .corner.br{right:12px;bottom:6px}
  .cross{position:absolute;width:9px;height:9px;z-index:2;pointer-events:none}
  .cross::before,.cross::after{content:"";position:absolute;background:var(--dim2)}
  .cross::before{left:4px;top:0;width:1px;height:9px} .cross::after{top:4px;left:0;height:1px;width:9px}

  .shell{position:absolute;inset:0;display:grid;padding:8px 34px 5px;gap:8px;
         grid-template-columns:minmax(0,1fr) 344px;grid-template-rows:30px 178px minmax(0,1fr) 15px}
  /* The nav pill, dragonfly's centre bar: mark · status dots · label */
  .pill{grid-column:1/-1;justify-self:center;display:flex;align-items:center;gap:22px;height:30px;
        padding:0 14px;background:#0f0f0f;border:1px solid var(--edge);border-radius:3px;min-width:380px}
  .pill svg{display:block}
  .pill .dots{display:flex;gap:3px;margin:0 auto}
  .pill .dots i{width:5px;height:5px;background:var(--dim2)}
  .pill .dots i.ok{background:var(--hot)}
  .pill .lbl{font-size:10px;letter-spacing:.08em;color:var(--bone);text-transform:uppercase}

  /* ── Cards ────────────────────────────────────────────────────────────── */
  .card{background:var(--card);border:1px solid var(--edge);border-radius:10px;min-width:0;min-height:0;
        position:relative;display:flex;flex-direction:column;padding:10px 12px 11px;overflow:hidden}
  .hd{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--bone);height:13px;flex:0 0 auto}
  .hd .n{color:var(--dim)}
  .hd .rt{margin-left:auto;color:var(--dim);display:flex;align-items:center;gap:6px}
  .live{width:6px;height:6px;border-radius:50%;background:var(--hot);box-shadow:0 0 8px var(--hot)}
  .live.off{background:var(--dim2);box-shadow:none}
  .rt.warn{color:var(--hot)}

  /* 01 · Time */
  .time{grid-column:1;grid-row:2;flex-direction:row;gap:0;padding:0}
  .clock{flex:1;min-width:0;padding:10px 14px 12px;display:flex;flex-direction:column}
  .hm{display:flex;align-items:flex-start;margin-top:2px}
  .hm .big{font-family:var(--serif);font-weight:200;font-size:112px;line-height:1;letter-spacing:-5px;margin-left:-4px;
           font-variant-numeric:lining-nums tabular-nums;font-optical-sizing:auto;color:var(--bone)}
  .hm .sec{font-family:var(--dot);font-weight:700;font-size:34px;color:var(--hot);margin:18px 0 0 12px;line-height:1;letter-spacing:1px}
  .hm .ap{display:none}
  .date{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-top:auto;display:flex;gap:14px}
  .date b{color:var(--bone);font-weight:400}
  .secbar{display:grid;grid-template-columns:repeat(60,1fr);gap:2px;height:5px;margin-top:9px}
  .secbar i{background:var(--ghost)} .secbar i.on{background:var(--hot)} .secbar i.q{background:var(--dim2)}
  .who{width:196px;flex:0 0 auto;border-left:1px solid var(--edge);padding:10px 14px 12px;display:flex;flex-direction:column;gap:0}
  .who .k{font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:9px}
  .who .k:first-of-type{margin-top:7px}
  .who .v{font-family:var(--serif);font-weight:300;font-size:24px;line-height:1.02;letter-spacing:-.4px;text-transform:uppercase;margin-top:2px}
  .who .s{font-size:11px;color:var(--dim);letter-spacing:.03em;margin-top:3px;text-transform:uppercase}
  .who .s b{color:var(--hot);font-weight:400}
  .who .v.muted{color:var(--dim)}

  /* 02 · Markets */
  .mkts{grid-column:2;grid-row:2}
  .tick{display:grid;grid-template-columns:52px minmax(0,1fr) 104px;align-items:center;gap:8px;
        flex:1;border-top:1px solid var(--edge);min-height:0}
  .tick:first-of-type{border-top:0}
  .tick .sym{font-size:13px;letter-spacing:.06em}
  .tick .sym small{display:block;font-size:9.5px;color:var(--dim);margin-top:3px;letter-spacing:.04em}
  .tick .px{font-family:var(--dot);font-weight:800;font-variation-settings:"wght" 800;font-size:27px;line-height:1;letter-spacing:.5px;white-space:nowrap}
  /* Doto's full stop is a four-dot cross that reads as "+": draw the point. */
  .tick .px .pt{display:inline-block;width:4px;height:4px;background:var(--bone);margin:0 3px 3px 2px;vertical-align:bottom}
  .tick .ch{font-size:11px;margin-top:3px;letter-spacing:.03em;white-space:nowrap}
  .tick .ch.up{color:var(--bone)} .tick .ch.dn{color:var(--hot)}
  .tick svg{width:104px;height:40px;display:block;overflow:visible}
  .mkts .ticks{flex:1;display:flex;flex-direction:column;margin-top:6px;min-height:0}
  .mkts.stale .ticks{opacity:.4}

  /* 03 · Room control */
  .room{grid-column:1;grid-row:3}
  .stations{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px;min-height:0}
  .station{display:flex;flex-direction:column;min-width:0;min-height:0}
  .station h3{font-size:10.5px;font-weight:400;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;color:var(--bone);
              height:30px;border-bottom:1px solid var(--edge);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .station h3 .cnt{color:var(--dim)}
  /* Station-wide switch. ALL OFF arms first (it can cut the monitors
     mid-work); ALL ON is one tap. Never touches locked or guarded tiles. */
  .all{margin-left:auto;height:26px;padding:0 8px;white-space:nowrap;flex:0 0 auto;border-radius:4px;border:1px solid var(--edge2);background:#121212;
       font:inherit;font-size:9.5px;letter-spacing:.1em;color:var(--dim);display:flex;align-items:center}
  .all.hasOn{color:var(--bone)}
  .all.armed{background:var(--hot);border-color:var(--hot);color:#000;animation:pulse .7s ease-in-out infinite}
  .all:active{transform:scale(.95)}
  ul{list-style:none;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
  /* Finger targets: 56px is the floor that stops a thumb hitting two rows. */
  li{flex:1 1 0;min-height:58px;max-height:96px;display:flex;min-width:0;border-radius:7px;
     background:var(--card2);border:1px solid var(--edge);position:relative;overflow:hidden;
     transition:background .15s,border-color .15s}
  li .main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:7px 7px 7px 10px}
  li .nm{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1;letter-spacing:-.1px;color:var(--dim);
         overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  li .ft{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase}
  li .ft .st{min-width:22px}
  li .seg{display:flex;gap:2px;flex:1;max-width:60px}
  li .seg i{flex:1;height:4px;background:var(--ghost)}
  li.on{background:#261006;border-color:var(--hotedge)}
  li.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hot)}
  li.on .nm{color:var(--bone)}
  li.on .ft{color:var(--hot)}
  li.on .seg i.f{background:var(--hot)}
  li .more{flex:0 0 44px;flex-direction:column;gap:3px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--edge);
           font-size:9px;letter-spacing:.1em;color:var(--dim)}
  li.on .more{border-left-color:var(--hotedge);color:var(--hot2)}
  li.tappable:active{transform:scale(.97)}
  li.unnamed .nm{font-style:italic}
  /* Protected rows are visibly not buttons. The server refuses them too:
     this is the label, not the lock. */
  li.locked{opacity:.45;border-style:dashed;background:transparent}
  li.locked::before{display:none}
  li.locked .ft{color:var(--dim)}
  /* In flight: must not read as the old state, nor the new one until the
     device says so. */
  li.pending{border-color:var(--bone);animation:pulse 1s ease-in-out infinite}
  li.arming{border-color:var(--hot);background:#2a0f05;animation:pulse .7s ease-in-out infinite}
  li.arming .ft{color:var(--hot)}
  li.offline{opacity:.45;border-style:dashed}
  li.failed{border-color:#ff2d2d}
  @keyframes pulse{50%{opacity:.5}}
  .room.stale .stations{opacity:.28;filter:grayscale(1)}

  /* 04 · RuView */
  .rv{grid-column:2;grid-row:3}
  #ascii{display:block;width:100%;flex:1;min-height:0;margin-top:8px}
  .nodes{display:flex;flex-direction:column;gap:5px;margin-top:8px;flex:0 0 auto}
  .node{display:grid;grid-template-columns:44px minmax(0,1fr) 34px 54px 44px;gap:7px;align-items:center;height:16px;font-size:11px;letter-spacing:.02em;white-space:nowrap}
  .node .id{color:var(--bone)} .node .id b{color:var(--hot);font-weight:400;font-size:8px;margin-left:3px;vertical-align:1px}
  .node .bar{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:9px}
  .node .bar i{background:var(--ghost)} .node .bar i.f{background:var(--bone)} .node .bar i.h{background:var(--hot)}
  .node .num{text-align:right;color:var(--bone);font-variant-numeric:tabular-nums}
  .node .num.d{color:var(--dim)}
  .node.down{opacity:.4}
  .rvft{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;
        border-top:1px solid var(--edge);padding-top:7px;margin-top:8px}
  .rvft b{font-weight:400;color:var(--bone)} .rvft b.w{color:var(--hot)}
  .rv.stale #ascii,.rv.stale .nodes{opacity:.35}

  .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:0 2px}
  .foot{font-size:10px}
  .foot b{color:var(--bone);font-weight:400}

  /* ── Brightness / colour sheet: full-bleed, a thumb not a mouse ────────── */
  .sheet{position:fixed;inset:0;z-index:10;background:#000;display:none;flex-direction:column;padding:22px 40px 20px;gap:11px}
  .sheet.open{display:flex}
  .sheet h3{display:flex;align-items:flex-end;gap:18px}
  .sheet h3 .t{font-family:var(--serif);font-weight:200;font-size:58px;line-height:.9;letter-spacing:-2px;text-transform:uppercase}
  .sheet h3 .now{margin-left:auto;font-family:var(--dot);font-weight:700;font-size:40px;color:var(--hot);line-height:1}
  .pwr{padding:9px 18px;border-radius:4px;border:1px solid var(--edge2);background:#0f0f0f;font:inherit;font-size:11px;letter-spacing:.1em;color:var(--dim)}
  .pwr.on{background:var(--hot);border-color:var(--hot);color:#000}
  .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:4px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:48px;border-radius:4px;border:1px solid var(--edge2)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:46px;border-radius:2px;background:var(--hot);margin-top:0;box-shadow:0 0 14px var(--hot)}
  #bri::-webkit-slider-runnable-track{background:repeating-linear-gradient(90deg,transparent 0 9px,#000 9px 11px),linear-gradient(90deg,#1a1a1a,#ecebe7)}
  #ct::-webkit-slider-runnable-track{background:repeating-linear-gradient(90deg,transparent 0 9px,#000 9px 11px),linear-gradient(90deg,#ffb45c,#fff5e8,#cfe4ff)}
  .presets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pre{height:56px;border-radius:4px;border:1px solid var(--edge2);background:#0f0f0f;color:var(--bone);font:inherit;
       font-size:12px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .pre small{font-size:9.5px;color:var(--dim);letter-spacing:.1em}
  .pre.cur{border-color:var(--hot);color:var(--hot)}
  .pre:active{transform:scale(.95)}
  .pre .chip{width:34px;height:8px;border-radius:2px}
  .swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
  /* Night: a dark veil that catches the FIRST touch, so waking the panel in
     a dark room never also switches the lamp under your thumb. */
  .veil{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.62);display:none}
  body.night .veil{display:block}
  .sw{height:50px;border-radius:4px;border:1px solid #2a2a2a}
  .sw:active{transform:scale(.94)}
  .sheet .close{margin-top:auto;align-self:flex-end;padding:13px 34px;border-radius:4px;border:1px solid var(--edge2);background:#0f0f0f;color:var(--bone);font:inherit;font-size:12px;letter-spacing:.12em}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:20;background:#0f0f0f;border:1px solid var(--hot);
         color:var(--bone);padding:9px 16px;border-radius:4px;font-size:11px;letter-spacing:.04em;display:none;max-width:760px}
  .toast.show{display:block}
  .banner{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;padding:6px 16px;background:var(--hot);color:#000;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  body.stale .banner{display:block}
</style></head><body>

<span class="corner tl">C</span><span class="corner tr">E</span><span class="corner bl">U</span><span class="corner br">S</span>

<div class="shell">
  <div class="pill">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#ecebe7" stroke-width="1.3"><circle cx="9" cy="9" r="5.2"/><path d="M9 0v5M9 13v5M0 9h5M13 9h5"/><circle cx="9" cy="9" r="1" fill="#fa4c14" stroke="none"/></svg>
    <span class="dots" id="dots" title="clock · controls · presence · ruview · markets"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="lbl">Studio</span>
  </div>

  <!-- 01 TIME -->
  <section class="card time">
    <div class="clock">
      <div class="hd"><span class="n">01</span>Local time<span class="rt" id="tz">EDT</span></div>
      <div class="hm"><span class="big" id="hm">--:--</span><span class="sec" id="sec">--</span></div>
      <div class="date" id="date"></div>
      <div class="secbar" id="secbar"></div>
    </div>
    <div class="who">
      <div class="hd"><span class="n">&nbsp;</span>Room<span class="rt" id="whoAge"></span></div>
      <div class="k">Presence</div>
      <div class="v" id="who">—</div>
      <div class="s" id="whoS"></div>
      <div class="k">Running</div>
      <div class="v" id="onCount">—</div>
      <div class="s" id="onS"></div>
    </div>
  </section>

  <!-- 02 MARKETS -->
  <section class="card mkts" id="mkts">
    <div class="hd"><span class="n">02</span>Markets<span class="rt" id="mktAge">—</span></div>
    <div class="ticks" id="ticks"></div>
  </section>

  <!-- 03 ROOM CONTROL -->
  <section class="card room" id="room">
    <div class="hd"><span class="n">03</span>Room control<span class="rt" id="age">connecting</span></div>
    <div class="stations" id="board"></div>
  </section>

  <!-- 04 RUVIEW -->
  <section class="card rv" id="rv">
    <div class="hd"><span class="n">04</span>RuView · WiFi sensing<span class="rt" id="rvAge">—</span></div>
    <canvas id="ascii"></canvas>
    <div class="nodes" id="nodes"></div>
    <div class="rvft"><span>Fusion <b id="fus">—</b></span><span>People <b id="ppl">NO FIX</b></span><span>Nodes <b id="nct">—</b></span></div>
  </section>

  <div class="foot"><span id="sys">● Starting</span><span>Cleetus · creo-bots-pi</span></div>
</div>

<i class="cross" style="left:35px;top:44px"></i><i class="cross" style="right:35px;top:44px"></i>
<i class="cross" style="left:35px;bottom:24px"></i><i class="cross" style="right:35px;bottom:24px"></i>

<section class="sheet" id="sheet">
  <h3><span class="t" id="sName">Lamp</span><button class="pwr" id="sPwr">ON</button><span class="now" id="sNow"></span></h3>
  <div class="lab">Brightness</div>
  <div class="presets" id="briP"></div>
  <input type="range" id="bri" min="2" max="100" step="1" value="50">
  <div class="lab" id="ctLab">White</div>
  <div class="presets" id="ctP"></div>
  <div class="lab" id="swLab">Colour</div>
  <div class="swatches" id="sw"></div>
  <button class="close" id="sClose">DONE</button>
</section>
<div class="toast" id="toast"></div>
<div class="veil" id="veil"></div>
<div class="banner" id="banner"></div>

<script>
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;};
const health={clock:true,controls:false,presence:false,ruview:false,markets:false};
function paintDots(){ const ks=["clock","controls","presence","ruview","markets"];
  [...$("dots").children].forEach((d,i)=>d.classList.toggle("ok",!!health[ks[i]]));
  const bad=ks.filter(k=>!health[k]);
  $("sys").innerHTML = bad.length ? `<b style="color:var(--hot)">●</b> Degraded · ${bad.join(" · ")}` : `<b style="color:var(--hot)">●</b> All systems nominal`;
}
function ago(ms){ if(ms==null) return "—"; const s=Math.round(ms/1000);
  if(s<60) return s+"s"; const m=Math.floor(s/60); if(m<60) return m+"m"; return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"); }
function say(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(say._t); say._t=setTimeout(()=>t.classList.remove("show"),4000); }

// ── 01 Clock ────────────────────────────────────────────────────────────────
const secbar=$("secbar"); for(let i=0;i<60;i++){ const b=el("i"); if(i%15===0) b.className="q"; secbar.append(b); }
function clock(){
  const d=new Date();
  $("hm").textContent=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const s=d.getSeconds(); $("sec").textContent=String(s).padStart(2,"0");
  [...secbar.children].forEach((b,i)=>{ b.classList.toggle("on",i<=s); });
  const day=d.toLocaleDateString("en-US",{weekday:"long"}), md=d.toLocaleDateString("en-GB",{day:"2-digit",month:"long"});
  const wk=Math.ceil((((d-new Date(d.getFullYear(),0,1))/864e5)+new Date(d.getFullYear(),0,1).getDay()+1)/7);
  $("date").innerHTML=`<b>${day}</b><span>${md} ${d.getFullYear()}</span><span>WK ${wk}</span>`;
  $("tz").textContent=d.toLocaleTimeString("en-US",{timeZoneName:"short"}).split(" ").pop();
  setTimeout(clock, 1000 - (Date.now()%1000) + 5);
}
clock();

// ── 03 Room control (ported from the Room panel; same guards) ───────────────
let lastGood=0, pending=new Map(), pausedUntil=0, armed=null, model=null;

async function tap(item, li){
  if(item.protected){ say(item.protected); return; }
  if(item.reachable===false){ say(item.name+" is offline"); return; }
  if(pending.has(item.id)) return;
  // Confirm-guarded (powered speakers): first tap arms, second within 4 s fires.
  if(item.confirm){
    const now=Date.now();
    if(!armed || armed.id!==item.id || now>armed.until){
      armed={id:item.id, until:now+4000};
      li.classList.add("arming"); say(item.confirm);
      pausedUntil=armed.until;
      clearTimeout(tap._disarm); tap._disarm=setTimeout(()=>{ armed=null; render(); },4000);
      return;
    }
    armed=null; clearTimeout(tap._disarm); li.classList.remove("arming");
  }
  const want=!item.on;
  pending.set(item.id,want);
  li.classList.add("pending"); li.classList.remove("failed");
  pausedUntil=Date.now()+1500;
  try{
    const r=await fetch("/controls/set",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:item.id,on:want})});
    const d=await r.json();
    if(!d.ok){ li.classList.add("failed"); say(d.error||"did not switch"); }
    else { item.on=d.on; item.detail=d.detail??item.detail; if(d.brightness!=null) item.brightness=d.brightness; }
  }catch(e){ li.classList.add("failed"); say("no reply: "+e.message); }
  finally{ pending.delete(item.id); li.classList.remove("pending"); pausedUntil=Date.now()+300; render(); }
}

// Gamut C xy pairs: DEVICE coordinates, not RGB, or "red" clamps to orange.
const SWATCHES=[
  ["#ff2d2d",[0.6915,0.3083]],["#ff7a18",[0.5825,0.3901]],["#ffb020",[0.5269,0.4133]],
  ["#ffe94d",[0.4432,0.5154]],["#7cff4d",[0.2100,0.6800]],["#22d17a",[0.1700,0.7000]],
  ["#25d6d6",[0.1600,0.3200]],["#3aa0ff",[0.1500,0.1000]],["#7a5cff",[0.2000,0.0800]],
  ["#ff5cc8",[0.3800,0.1600]],
];
const sheet=$("sheet"), briEl=$("bri"), swEl=$("sw");
let cur=null, sendTimer=null;
function paintSheet(){ if(!cur) return;
  $("sName").textContent=cur.name;
  $("sPwr").textContent=cur.on?"ON":"OFF"; $("sPwr").className="pwr"+(cur.on?" on":"");
  $("sNow").textContent=cur.on?`${Math.round(briEl.value)}%`:"OFF";
}
// Throttle while dragging: one PUT per pixel floods the bridge.
function push(patch, now){
  const send=async()=>{
    try{
      const r=await fetch("/controls/set",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:cur.id,...patch})});
      const d=await r.json();
      if(!d.ok) say(d.error||"did not apply");
      else { cur.on=d.on; if(d.brightness!=null) cur.brightness=d.brightness; cur.detail=d.detail??cur.detail; paintSheet(); }
    }catch(e){ say("no reply: "+e.message); }
    pausedUntil=Date.now()+1500;
  };
  clearTimeout(sendTimer);
  if(now) send(); else sendTimer=setTimeout(send,220);
}
// Presets first: a thumb hits a 56 px button every time, a slider rarely
// lands where you meant. The slider stays for in-between values.
const BRI_P=[[5,"Night"],[25,"Low"],[50,"Half"],[75,"High"],[100,"Full"]];
const CT_P=[[447,"Candle","#ff9f45"],[370,"Warm","#ffc27a"],[300,"Soft","#ffe2b8"],[233,"Neutral","#fff4e6"],[153,"Cool","#d6e8ff"]];
function paintPresets(){
  if(!cur) return;
  $("briP").replaceChildren(...BRI_P.map(([v,l])=>{
    const b=el("button","pre"+(cur.on&&Math.abs((cur.brightness??-99)-v)<3?" cur":""));
    b.innerHTML=`${v}%<small>${l}</small>`;
    b.addEventListener("click",()=>{ briEl.value=v; cur.brightness=v; cur.on=true; push({brightness:v,on:true},true); paintPresets(); paintSheet(); poke(); });
    return b;
  }));
  $("ctP").replaceChildren(...CT_P.map(([m,l,c])=>{
    const b=el("button","pre"+(cur.mirek!=null&&Math.abs(cur.mirek-m)<12?" cur":""));
    b.innerHTML=`<span class="chip" style="background:${c}"></span><small>${l}</small>`;
    b.addEventListener("click",()=>{ cur.mirek=m; push({mirek:m,on:true},true); paintPresets(); poke(); });
    return b;
  }));
}
// A sheet left open would hide the whole panel until someone walks over, so
// it closes itself after 25 s without a touch.
let sheetIdle=null;
function poke(){ clearTimeout(sheetIdle); sheetIdle=setTimeout(closeSheet,25000); }
function closeSheet(){ sheet.classList.remove("open"); cur=null; clearTimeout(sheetIdle); render(); }
sheet.addEventListener("pointerdown",poke);
function openSheet(item){
  cur=item;
  briEl.value=Math.round(item.brightness??50);
  const showCT=!!item.ctCapable, showColor=!!item.colorCapable;
  $("ctP").style.display=$("ctLab").style.display=showCT?"":"none";
  $("briP").style.display=item.dimmable?"":"none";
  swEl.style.display=$("swLab").style.display=showColor?"":"none";
  briEl.style.display=item.dimmable?"":"none";
  paintSheet(); paintPresets(); sheet.classList.add("open"); poke();
}
swEl.replaceChildren(...SWATCHES.map(([css,xy])=>{ const b=el("div","sw"); b.style.background=css;
  b.addEventListener("click",()=>{ cur.mirek=null; push({xy,on:true},true); paintPresets(); }); return b; }));
briEl.addEventListener("input",()=>{ $("sNow").textContent=`${briEl.value}%`; push({brightness:Number(briEl.value),on:true}); });
briEl.addEventListener("change",()=>push({brightness:Number(briEl.value),on:true},true));
$("sPwr").addEventListener("click",()=>push({on:!cur.on},true));
$("sClose").addEventListener("click",closeSheet);

function row(item){
  const li=el("li");
  li.className=(item.on?"on ":"")+(item.named_in_home===false?"unnamed ":"")+(item.protected?"locked ":"tappable");
  if(pending.has(item.id)) li.classList.add("pending");
  if(armed && armed.id===item.id && Date.now()<armed.until) li.classList.add("arming");
  if(item.reachable===false) li.classList.add("offline");
  const main=el("div","main"); main.append(el("span","nm",item.name));
  const ft=el("div","ft");
  let st;
  if(item.protected) st="Locked";
  else if(item.reachable===false) st="Offline";
  else if(item.confirm && armed && armed.id===item.id) st="Tap again";
  else st=item.on?(item.dimmable&&item.brightness!=null?Math.round(item.brightness)+"%":"On"):"Off";
  ft.append(el("span","st",st));
  if(item.dimmable && !item.protected){
    const seg=el("span","seg"); const n=Math.round((item.brightness??0)/10);
    for(let i=0;i<10;i++){ const b=el("i"); if(item.on && i<n) b.className="f"; seg.append(b); }
    ft.append(seg);
  } else if(item.confirm){ ft.append(el("span",null,"· guarded")); }
  main.append(ft); li.append(main);
  // Two targets, far apart: the tile toggles (the common action stays one
  // tap), the ADJ strip opens brightness and colour.
  if(item.dimmable || item.colorCapable){
    const m=el("span","more");
    m.innerHTML=`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>ADJ`;
    m.addEventListener("click",e=>{ e.stopPropagation(); openSheet(item); });
    li.append(m);
  }
  // Locked rows listen TOO: a silent refusal reads as a dead panel.
  li.addEventListener("click",()=>tap(item,li));
  return li;
}
// ── Station-wide switch ─────────────────────────────────────────────────────
// Only plain tiles: never a locked one (the Pi's own power), never a guarded
// one (the powered speakers), never one that is offline.
const bulkable=g=>g.items.filter(i=>!i.protected && !i.confirm && i.reachable!==false);
let allArmed=null;
async function allTap(g,wantOn){
  if(!wantOn){
    if(!allArmed || allArmed.g!==g.name || Date.now()>allArmed.until){
      allArmed={g:g.name, until:Date.now()+3500}; pausedUntil=allArmed.until;
      say(`Tap Confirm to switch off everything at ${g.name}`); render();
      clearTimeout(allTap._t); allTap._t=setTimeout(()=>{ allArmed=null; render(); },3500);
      return;
    }
    allArmed=null; clearTimeout(allTap._t);
  }
  const targets=bulkable(g).filter(i=>i.on!==wantOn);
  targets.forEach(i=>pending.set(i.id,wantOn)); render();
  let failed=0;
  // One at a time: the Meross side is one warm session, and a burst of
  // parallel writes is exactly the kind of pile-up this panel avoids.
  for(const i of targets){
    pausedUntil=Date.now()+4000;
    try{
      const r=await fetch("/controls/set",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:i.id,on:wantOn})});
      const d=await r.json();
      if(d.ok){ i.on=d.on; i.detail=d.detail??i.detail; } else failed++;
    }catch{ failed++; }
    pending.delete(i.id); render();
  }
  pausedUntil=Date.now()+300;
  if(failed) say(`${failed} of ${targets.length} at ${g.name} did not switch`);
}

function render(){
  if(!model) return;
  $("board").replaceChildren(...model.groups.map(g=>{
    const s=el("div","station"); const h=el("h3",null,g.name);
    if(g.online===false) h.append(el("span","cnt","offline"));
    const bulk=bulkable(g);
    if(bulk.length>1){
      const anyOn=bulk.some(i=>i.on), isArmed=allArmed&&allArmed.g===g.name&&Date.now()<allArmed.until;
      const b=el("button","all"+(anyOn?" hasOn":"")+(isArmed?" armed":""), isArmed?"Confirm":(anyOn?"All off":"All on"));
      b.addEventListener("click",e=>{ e.stopPropagation(); allTap(g,!anyOn); });
      h.append(b);
    }
    s.append(h);
    const ul=el("ul"); g.items.forEach(i=>ul.append(row(i))); s.append(ul); return s;
  }));
  const items=model.groups.flatMap(g=>g.items).filter(i=>!i.protected);
  const on=items.filter(i=>i.on);
  $("onCount").textContent=`${on.length} of ${items.length}`;
  const lamps=on.filter(i=>i.dimmable).length;
  $("onS").innerHTML=`<b>${lamps}</b> lamps · ${on.length-lamps} outlets`;
}
function paintAge(){
  const age=lastGood?Date.now()-lastGood:null, a=$("age");
  const stale=age==null||age>60000;
  document.body.classList.toggle("stale",!!lastGood && stale);
  $("room").classList.toggle("stale",!!lastGood && stale);
  if(!lastGood){ a.textContent="connecting"; a.className="rt"; }
  else if(stale){ a.textContent=`not updating · ${ago(age)}`; a.className="rt warn";
    $("banner").textContent=`Room control has not updated for ${ago(age)} — these states may be wrong`; }
  else { a.innerHTML=`<span class="live"></span>live`; a.className="rt"; }
  health.controls=!!lastGood && !stale;
}
async function tickControls(){
  if(Date.now()<pausedUntil){ paintAge(); return; }
  try{
    const r=await fetch("/controls",{cache:"no-store",signal:AbortSignal.timeout(10000)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(!d || !Array.isArray(d.groups)) throw new Error("bad shape");
    if(Date.now()<pausedUntil) return;   // a tap landed while this was in flight
    model=d; lastGood=Date.now(); render();
  }catch(e){ /* keep the last good board; paintAge dims it past 60 s */ }
  paintAge();
}

// ── 02 Markets ──────────────────────────────────────────────────────────────
const fmt=(n,d=2)=>n==null?"—":n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
function spark(q){
  const W=104,H=40, pts=q.spark||[]; if(pts.length<2) return "";
  const lo=Math.min(...pts,q.prev??Infinity), hi=Math.max(...pts,q.prev??-Infinity), span=(hi-lo)||1;
  const x=i=>(i/(pts.length-1))*W, y=v=>H-2-((v-lo)/span)*(H-4);
  const path=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join("");
  const dn=q.change<0, col=dn?"#fa4c14":"#ecebe7";
  const base=q.prev!=null?`<line x1="0" x2="${W}" y1="${y(q.prev).toFixed(1)}" y2="${y(q.prev).toFixed(1)}" stroke="#4a4a4a" stroke-dasharray="1 3"/>`:"";
  const lx=x(pts.length-1), ly=y(pts[pts.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}">${base}<path d="${path} L${W} ${H} L0 ${H}Z" fill="${col}" opacity=".07"/>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.4" fill="#fa4c14"/></svg>`;
}
let mktGood=0, mktOpen=false;
async function tickMarkets(){
  try{
    const r=await fetch("/quotes",{cache:"no-store",signal:AbortSignal.timeout(12000)});
    const d=await r.json();
    if(!d.symbols?.length) throw new Error(d.error||"no quotes");
    mktOpen=d.symbols.some(q=>q.open);
    $("ticks").replaceChildren(...d.symbols.map(q=>{
      const t=el("div","tick"); const dn=(q.change??0)<0;
      t.innerHTML=`<div class="sym">${q.symbol}<small>${q.open?"LIVE":"CLOSE"}</small></div>
        <div><div class="px">${fmt(q.price).replace(".",'<i class="pt"></i>')}</div>
        <div class="ch ${dn?"dn":"up"}">${dn?"▼":"▲"} ${fmt(Math.abs(q.change))} · ${q.changePct>0?"+":""}${fmt(q.changePct)}%</div></div>
        ${spark(q)}`;
      return t;
    }));
    const age=d.age_ms??0; mktGood=Date.now()-age;
    const stale=age>(mktOpen?180000:1800000);
    $("mkts").classList.toggle("stale",stale);
    $("mktAge").className="rt"+(stale?" warn":"");
    $("mktAge").innerHTML=mktOpen?`<span class="live"></span>NYSE open · ${ago(age)}`:`NYSE closed`;
    health.markets=!stale;
  }catch(e){
    health.markets=false; $("mkts").classList.add("stale");
    $("mktAge").className="rt warn"; $("mktAge").textContent=mktGood?`no feed · ${ago(Date.now()-mktGood)}`:"no feed";
  }
}

// ── 04 RuView + presence ────────────────────────────────────────────────────
let rv=null, rvGood=0;
const RAMP=" .·:-=+*#%@";
const cv=$("ascii"), cx=cv.getContext("2d");
function sizeCanvas(){ const r=cv.getBoundingClientRect(); cv.width=Math.round(r.width); cv.height=Math.round(r.height); }
// An ASCII waterfall of each node's motion energy, newest column on the right:
// one band per node. It is the per-node traces ruview-dash already keeps, drawn
// the way dragonfly draws its dragonfly. No positions, no people: the scope
// has no trustworthy fix, so it does not pretend to one.
let phase=0;
function drawAscii(){
  const W=cv.width,H=cv.height; cx.fillStyle="#0a0a0a"; cx.fillRect(0,0,W,H);
  // Canvas font does NOT resolve CSS var(): name the family literally.
  cx.font='500 11px "Geist Mono"'; cx.textBaseline="top";
  const cw=7, ch=11, cols=Math.floor(W/cw), fleet=(rv&&rv.fleet)||[];
  const bands=Math.max(fleet.length,1), rowsPer=Math.floor(H/ch/bands);
  phase+=1;
  for(let b=0;b<bands;b++){
    const n=fleet[b], tr=(n&&n.trace)||[], down=!n||n.status!=="active";
    const y0=b*rowsPer*ch;
    for(let c=0;c<cols;c++){
      const idx=tr.length-cols+c, v=idx>=0?tr[idx]:null;
      const lvl=v==null?0:Math.min(1,Math.log1p(v)/Math.log1p(32));
      for(let r=0;r<rowsPer;r++){
        // Energy fills the band from its centre line outwards, like a waveform.
        const mid=(rowsPer-1)/2, dist=Math.abs(r-mid)/(mid+.5);
        const k=lvl-dist*0.9 + (Math.sin((c+phase*.25)*.35+r)*.04);
        if(k<=0.02) { if((c+r)%7===0){ cx.fillStyle="#1a1a1a"; cx.fillText("·",c*cw,y0+r*ch); } continue; }
        const ch_=RAMP[Math.min(RAMP.length-1,Math.max(1,Math.round(k*(RAMP.length-1))))];
        const hot=c>=cols-3 || k>.72;
        cx.fillStyle=down?"#333":(hot?"#fa4c14":`rgba(236,235,231,${.35+k*.65})`);
        cx.fillText(ch_,c*cw,y0+r*ch);
      }
    }
    if(b) { cx.fillStyle="#1d1d1d"; cx.fillRect(0,y0-1,W,1); }
  }
}
function paintRuview(){
  const nodes=$("nodes"), f=(rv&&rv.fleet)||[];
  const byId=[...f].sort((a,b)=>a.id-b.id);
  nodes.replaceChildren(...byId.map(n=>{
    const d=el("div","node"+(n.status==="active"?"":" down"));
    const e=n.energy??0, fill=Math.round(Math.min(1,Math.log1p(e)/Math.log1p(32))*24);
    const bar=el("div","bar"); for(let i=0;i<24;i++){ const b=el("i"); if(i<fill) b.className=i>=18?"h":"f"; bar.append(b); }
    d.innerHTML=`<span class="id">N${n.id}${n.leader?"<b>LEAD</b>":""}</span>`;
    d.append(bar);
    d.insertAdjacentHTML("beforeend",`<span class="num">${e.toFixed(1)}</span><span class="num d">${n.rssi??"—"} dBm</span><span class="num d">${Math.round(n.fps??0)} fps</span>`);
    return d;
  }));
  if(rv){
    // An empty window reports median 0 ms; that is "no samples", not "instant".
    const fu=rv.fusion; $("fus").textContent=fu&&fu.samples?`${Math.round(fu.medianMs)} / ${fu.guardMs} ms`:"—";
    $("fus").className=fu&&(fu.degraded||fu.failing)?"w":"";
    $("nct").textContent=`${rv.activeCount}/${rv.totalCount}`;
    // The server's head count is fabricated (0 detections after millions of
    // frames); show that we have no fix rather than its number.
    $("ppl").textContent=rv.trustworthy&&rv.claimedPersons!=null?String(rv.claimedPersons):"NO FIX";
  }
}
function paintPresence(){
  const p=rv&&rv.presence; const who=$("who"), s=$("whoS");
  if(!p||p.ok===false){ who.textContent="Unknown"; who.className="v muted"; s.textContent=p&&p.error?p.error:"no presence feed"; health.presence=false; return; }
  health.presence=true;
  const named=(p.named||[]).filter(Boolean);
  const desk=p.desk||{}, idle=desk.idle_seconds;
  const idleTxt=idle==null?"":(idle<60?"active now":`idle ${ago(idle*1000)}`);
  if(named.length){ who.textContent=named.join(" + "); who.className="v"; }
  else if(desk.at_desk){ who.textContent="At the desk"; who.className="v"; }
  else { who.textContent="Desk empty"; who.className="v muted"; }
  const bits=[];
  if(desk.at_desk!=null) bits.push(desk.at_desk?`<b>●</b> ${idleTxt}`:idleTxt);
  if(p.camera && p.camera!=="up" && p.camera!=="ok") bits.push(`camera ${p.camera}`);
  s.innerHTML=bits.join(" · ");
}
async function tickRuview(){
  try{
    const r=await fetch("/ruview",{cache:"no-store",signal:AbortSignal.timeout(5000)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    rv=await r.json(); rvGood=Date.now();
  }catch(e){ /* keep last; age shows it */ }
  const age=rvGood?Date.now()-rvGood+(rv?.ageMs||0):null;
  const stale=age==null||age>15000||!(rv&&rv.ok);
  $("rv").classList.toggle("stale",stale);
  $("rvAge").className="rt"+(stale?" warn":"");
  $("rvAge").innerHTML=stale?(rvGood?`stale · ${ago(age)}`:"no feed"):`<span class="live"></span>v${rv.version||"?"}`;
  health.ruview=!stale;
  paintRuview(); paintPresence(); paintDots();
}

// ── Night: 23:00 to 06:30 the panel sits under a dark veil. The first touch
// only lifts it (90 s), so waking the screen never switches anything. ────────
let wokeUntil=0;
function nightCheck(){
  const d=new Date(), m=d.getHours()*60+d.getMinutes();
  const night=(m>=23*60 || m<6*60+30) && Date.now()>wokeUntil && !sheet.classList.contains("open");
  document.body.classList.toggle("night",night);
}
$("veil").addEventListener("click",e=>{ e.stopPropagation(); wokeUntil=Date.now()+90000; nightCheck(); });
addEventListener("pointerdown",()=>{ if(!document.body.classList.contains("night") && wokeUntil>Date.now()) wokeUntil=Date.now()+90000; },true);

// ── Loops. Each one awaits itself, so a slow endpoint can never stack
// requests (the ruview-dash leak that froze this Pi was exactly that). ─────
function loop(fn,ms){ (async function go(){ try{ await fn(); }catch{} setTimeout(go,ms); })(); }
document.fonts.ready.then(()=>{
  sizeCanvas(); addEventListener("resize",sizeCanvas);
  setInterval(drawAscii,125);
});
loop(tickControls,2000);
loop(tickRuview,1000);
loop(tickMarkets,20000);
setInterval(()=>{ paintAge(); paintDots(); nightCheck(); },1000);
nightCheck();
</script>
</body></html>
