    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>

        /* ── TOKENS ─────────────────────────────────────── */
        :root {
            --forest:     #0E1A0D;
            --green:      #182818;
            --green-mid:  #253D25;
            --paper:      #EDD9A3;
            --paper-lt:   #F5EAC5;
            --amber:      #C88C1A;
            --amber-dim:  #9A6C14;
            --cream:      #F8EDD0;
            --nav-h:      60px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Oswald', sans-serif;
            background: var(--forest);
            color: var(--cream);
            overflow: hidden;
        }

        /* ── GRAIN ──────────────────────────────────────── */
        #grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        /* ── NAV ───────────────────────────────────────── */
        #nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 500;
            height: var(--nav-h);
            padding: 0 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 20, 10, 0.96);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(200,140,26,0.18);
        }

        .nav-logo {
            display: flex;
            align-items: baseline;
            gap: 0.55rem;
            text-decoration: none;
        }

        .nav-logo .magnolia {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 1.4rem;
            color: var(--cream);
        }

        .nav-logo .co {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 0.48rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--amber);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            font-size: 0.6rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--cream);
            opacity: 0.5;
            text-decoration: none;
            transition: opacity 0.2s, color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active { opacity: 1; color: var(--amber); }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--amber);
            outline-offset: 4px;
        }

        .back-link {
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            font-size: 0.58rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--amber);
            opacity: 0.7;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }

        .back-link:hover { opacity: 1; }

        /* ── LAYOUT ─────────────────────────────────────── */
        .venue-layout {
            display: flex;
            height: 100vh;
            padding-top: var(--nav-h);
        }

        /* ── MAP ────────────────────────────────────────── */
        #map {
            flex: 1;
            height: 100%;
            background: #FFF8DC;
        }

        /* Cornsilk warmth on light tiles */
        .leaflet-tile-pane {
            filter: sepia(35%) hue-rotate(-5deg) saturate(0.85) brightness(1.04);
        }

        /* Hide Leaflet attribution (tiny) */
        .leaflet-control-attribution {
            font-size: 0.5rem;
            opacity: 0.6;
            background: rgba(255,248,220,0.88) !important;
            color: rgba(75,96,67,0.7) !important;
        }

        .leaflet-control-attribution a { color: rgba(75,96,67,0.7) !important; }

        /* Zoom controls — Essex green */
        .leaflet-control-zoom a {
            background: rgba(75,96,67,0.92) !important;
            border-color: rgba(75,96,67,0.4) !important;
            color: #FFF8DC !important;
            font-family: 'Oswald', sans-serif !important;
        }

        .leaflet-control-zoom a:hover { background: rgba(55,76,47,1) !important; }

        /* ── CUSTOM MARKERS ─────────────────────────────── */
        .map-dot {
            width: 14px;
            height: 14px;
            background: #4B6043;
            border-radius: 50%;
            border: 2px solid rgba(255,248,220,0.9);
            box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 0 0 0 rgba(75,96,67,0.4);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .map-dot:hover {
            transform: scale(1.5);
            box-shadow: 0 3px 12px rgba(0,0,0,0.4), 0 0 0 4px rgba(75,96,67,0.25);
        }

        .map-dot.selected {
            background: #FFF8DC;
            border-color: #4B6043;
            transform: scale(1.7);
            box-shadow: 0 3px 14px rgba(0,0,0,0.4), 0 0 0 5px rgba(75,96,67,0.3);
        }

        /* City label tooltips on map */
        .city-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .city-label-inner {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(75,96,67,0.65);
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(255,248,220,0.9);
        }

        /* ── PANEL ──────────────────────────────────────── */
        #panel {
            width: 400px;
            flex-shrink: 0;
            height: 100%;
            background: var(--forest);
            border-left: 1px solid rgba(200,140,26,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Panel header */
        .panel-header {
            padding: 2rem 2rem 1.5rem;
            border-bottom: 1px solid rgba(200,140,26,0.1);
            flex-shrink: 0;
        }

        .panel-eyebrow {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 0.55rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--amber);
            display: block;
            margin-bottom: 0.4rem;
        }

        .panel-title {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--cream);
        }

        .panel-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.9rem;
            color: var(--cream);
            opacity: 0.4;
            margin-top: 0.25rem;
        }

        /* ── LIST VIEW ──────────────────────────────────── */
        #list-view {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0 2rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(200,140,26,0.2) transparent;
        }

        #list-view::-webkit-scrollbar { width: 4px; }
        #list-view::-webkit-scrollbar-track { background: transparent; }
        #list-view::-webkit-scrollbar-thumb { background: rgba(200,140,26,0.2); border-radius: 2px; }

        .market-group {
            margin-bottom: 0.5rem;
        }

        .market-label {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 0.55rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--amber);
            opacity: 0.6;
            padding: 1rem 2rem 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .market-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(200,140,26,0.12);
        }

        .venue-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 2rem;
            cursor: pointer;
            transition: background 0.18s;
            border-bottom: 1px solid rgba(200,140,26,0.05);
        }

        .venue-row:hover { background: rgba(200,140,26,0.06); }
        .venue-row.selected { background: rgba(200,140,26,0.1); }

        .venue-row-left { flex: 1; min-width: 0; }

        .venue-row-name {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--cream);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .venue-row.selected .venue-row-name { color: var(--amber); }

        .venue-row-type {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.82rem;
            color: var(--cream);
            opacity: 0.38;
            margin-top: 0.1rem;
        }

        .venue-row-cap {
            font-family: 'Oswald', sans-serif;
            font-weight: 400;
            font-size: 0.55rem;
            letter-spacing: 0.12em;
            color: var(--amber);
            opacity: 0.5;
            text-align: right;
            flex-shrink: 0;
            margin-left: 1rem;
        }

        /* ── DETAIL VIEW ────────────────────────────────── */
        #detail-view {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 2rem;
            display: none;
            scrollbar-width: thin;
            scrollbar-color: rgba(200,140,26,0.2) transparent;
        }

        #detail-view::-webkit-scrollbar { width: 4px; }
        #detail-view::-webkit-scrollbar-track { background: transparent; }
        #detail-view::-webkit-scrollbar-thumb { background: rgba(200,140,26,0.2); border-radius: 2px; }

        #detail-view.visible { display: block; }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1.2rem 2rem 0.8rem;
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            font-size: 0.56rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--amber);
            opacity: 0.6;
            cursor: pointer;
            border-bottom: 1px solid rgba(200,140,26,0.08);
            transition: opacity 0.2s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            width: 100%;
            text-align: left;
        }

        .back-btn:hover { opacity: 1; }

        .detail-body { padding: 1.75rem 2rem 0; }

        .detail-city-tag {
            display: inline-block;
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 0.5rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--forest);
            background: var(--amber);
            padding: 0.2rem 0.6rem;
            margin-bottom: 0.8rem;
        }

        .detail-name {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1.65rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--cream);
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .detail-meta span {
            font-family: 'Oswald', sans-serif;
            font-weight: 400;
            font-size: 0.58rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--cream);
            opacity: 0.38;
        }

        .detail-meta .dot {
            width: 3px;
            height: 3px;
            background: var(--amber);
            opacity: 0.4;
            border-radius: 50%;
        }

        .detail-address {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.9rem;
            color: var(--cream);
            opacity: 0.42;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .detail-divider {
            height: 1px;
            background: rgba(200,140,26,0.12);
            margin: 1.5rem 0;
        }

        .detail-desc {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            line-height: 1.85;
            color: var(--cream);
            opacity: 0.72;
            margin-bottom: 1.5rem;
        }

        .detail-acts-label {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 0.55rem;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: var(--amber);
            display: block;
            margin-bottom: 0.85rem;
        }

        .detail-acts {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .detail-acts li {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1rem;
            color: var(--cream);
            opacity: 0.62;
            padding: 0.35rem 0;
            border-bottom: 1px solid rgba(200,140,26,0.06);
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .detail-acts li::before {
            content: '◆';
            font-size: 0.3rem;
            color: var(--amber);
            opacity: 0.6;
            flex-shrink: 0;
        }

        /* ── MOBILE ─────────────────────────────────────── */
        @media (max-width: 768px) {
            :root { --nav-h: 116px; }

            #nav {
                height: var(--nav-h);
                padding: 0.85rem 1.2rem;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                gap: 0.75rem;
            }
            .nav-right,
            .nav-links {
                width: 100%;
            }
            .nav-links {
                flex-wrap: wrap;
                gap: 0.75rem 1rem;
            }
            .nav-links a {
                font-size: 0.52rem;
                letter-spacing: 0.15em;
            }
            .venue-layout { flex-direction: column; height: auto; overflow: auto; }
            #map { height: 55vw; min-height: 280px; flex: none; width: 100%; }
            #panel { width: 100%; height: auto; max-height: 60vh; overflow-y: auto; }
            html, body { overflow: auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>

// ── GRAIN ───────────────────────────────────────────────────
(function () {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.floor(Math.random() * 255);
        img.data[i] = img.data[i+1] = img.data[i+2] = v;
        img.data[i+3] = Math.floor(Math.random() * 22);
    }
    ctx.putImageData(img, 0, 0);
    const grain = document.getElementById('grain');
    grain.style.backgroundImage  = `url(${c.toDataURL()})`;
    grain.style.backgroundSize   = '256px 256px';
    grain.style.backgroundRepeat = 'repeat';
})();

// ── MAP INIT ─────────────────────────────────────────────────
const map = L.map('map', {
    center: [33.72, -82.18],
    zoom: 8,
    zoomControl: true,
    attributionControl: true,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
}).addTo(map);

// Move zoom control to bottom-right
map.zoomControl.setPosition('bottomright');

// City labels
const makeCityLabel = (lat, lng, name) => {
    L.marker([lat, lng], {
        icon: L.divIcon({
            className: 'city-label',
            html: `<div class="city-label-inner">${name}</div>`,
            iconAnchor: [0, 0],
        }),
        interactive: false,
        zIndexOffset: -100,
    }).addTo(map);
};

makeCityLabel(33.9700, -83.3750, 'ATHENS');
makeCityLabel(33.4800, -81.9680, 'AUGUSTA');
makeCityLabel(33.5480, -82.1200, 'EVANS / COLUMBIA CO.');


// ── MARKERS & LIST ──────────────────────────────────────────
const markers = {};
let selectedId = null;

const escapeHtml = value => String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

function makeMarkerIcon(selected = false) {
    return L.divIcon({
        className: '',
        html: `<div class="map-dot${selected ? ' selected' : ''}"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7],
    });
}

function formatCapacity(value) {
    const capacity = Number(value);
    return Number.isFinite(capacity) && capacity > 0
        ? `Cap. ${capacity.toLocaleString()}`
        : 'Capacity TBD';
}

function hasCoordinates(v) {
    return Number.isFinite(Number(v.lat)) && Number.isFinite(Number(v.lng));
}

function groupIdForVenue(v) {
    const city = String(v.city || '').toLowerCase();
    if (city.includes('athens')) return 'group-athens';
    if (city.includes('evans') || city.includes('columbia')) return 'group-evans';
    if (city.includes('north augusta')) return 'group-northaugusta';
    return 'group-augusta';
}

function clearVenueRows() {
    Object.values(markers).forEach(marker => map.removeLayer(marker));
    Object.keys(markers).forEach(key => delete markers[key]);
    document.querySelectorAll('.venue-row').forEach(row => row.remove());
    selectedId = null;
    document.getElementById('detail-view').classList.remove('visible');
    document.getElementById('list-view').style.display = '';
}

function renderVenues(nextVenues = venues) {
    venues = (nextVenues || []).filter(v => v && v.name);
    clearVenueRows();

    venues.forEach(v => {
        if (hasCoordinates(v)) {
            const marker = L.marker([Number(v.lat), Number(v.lng)], {
                icon: makeMarkerIcon(false),
                title: v.name,
            }).addTo(map);

            marker.on('click', () => selectVenue(v.id));
            markers[v.id] = marker;
        }

        const group = document.getElementById(groupIdForVenue(v));
        const row = document.createElement('div');
        row.className = 'venue-row';
        row.id = `row-${v.id}`;
        row.innerHTML = `
            <div class="venue-row-left">
                <div class="venue-row-name">${escapeHtml(v.name)}</div>
                <div class="venue-row-type">${escapeHtml([v.city, v.type].filter(Boolean).join(' · '))}</div>
            </div>
            <div class="venue-row-cap">${escapeHtml(formatCapacity(v.capacity))}</div>
        `;
        row.addEventListener('click', () => selectVenue(v.id));
        group.appendChild(row);
    });
}

renderVenues(venues);

fetch('/api/content')
    .then(response => response.ok ? response.json() : null)
    .then(payload => {
        if (payload?.venues?.length) renderVenues(payload.venues);
    })
    .catch(() => {});


// ── SELECT VENUE ─────────────────────────────────────────────
function selectVenue(id) {
    const v = venues.find(x => x.id === id);
    if (!v) return;

    // Deselect previous
    if (selectedId !== null) {
        if (markers[selectedId]) markers[selectedId].setIcon(makeMarkerIcon(false));
        const prevRow = document.getElementById(`row-${selectedId}`);
        if (prevRow) prevRow.classList.remove('selected');
    }

    selectedId = id;

    // Highlight marker
    if (markers[id]) markers[id].setIcon(makeMarkerIcon(true));
    document.getElementById(`row-${id}`)?.classList.add('selected');

    // Fly to venue
    if (hasCoordinates(v)) {
        map.flyTo([Number(v.lat), Number(v.lng)], 15, { duration: 1.2, easeLinearity: 0.4 });
    }

    // Show detail panel
    showDetail(v);
}

function showDetail(v) {
    document.getElementById('list-view').style.display = 'none';
    const detail = document.getElementById('detail-view');
    detail.classList.add('visible');

    const notableHtml = (v.notable || [])
        .map(act => `<li>${escapeHtml(act)}</li>`)
        .join('');
    const metaParts = [
        v.type,
        v.founded ? `Est. ${v.founded}` : '',
        Number(v.capacity) ? formatCapacity(v.capacity) : ''
    ].filter(Boolean);
    const metaHtml = metaParts
        .map((part, index) => `${index ? '<div class="dot"></div>' : ''}<span>${escapeHtml(part)}</span>`)
        .join('');

    document.getElementById('detail-body').innerHTML = `
        <div class="detail-city-tag">${escapeHtml(v.city)}</div>
        <div class="detail-name">${escapeHtml(v.name)}</div>
        <div class="detail-meta">
            ${metaHtml}
        </div>
        <div class="detail-address">
            <svg width="11" height="14" viewBox="0 0 11 14" fill="none" style="margin-top:2px;flex-shrink:0">
                <path d="M5.5 0C2.46 0 0 2.46 0 5.5c0 3.85 5.5 8.5 5.5 8.5S11 9.35 11 5.5C11 2.46 8.54 0 5.5 0zm0 7.5a2 2 0 110-4 2 2 0 010 4z" fill="rgba(200,140,26,0.45)"/>
            </svg>
            ${escapeHtml(v.address || 'Address pending')}
        </div>
        <div class="detail-divider"></div>
        <p class="detail-desc">${escapeHtml(v.description)}</p>
        <div class="detail-divider"></div>
        <span class="detail-acts-label">Notable Acts / Fit</span>
        <ul class="detail-acts">${notableHtml}</ul>
    `;

    detail.scrollTop = 0;
}

// Back button
document.getElementById('back-btn').addEventListener('click', () => {
    // Deselect
    if (selectedId !== null) {
        if (markers[selectedId]) markers[selectedId].setIcon(makeMarkerIcon(false));
        const row = document.getElementById(`row-${selectedId}`);
        if (row) row.classList.remove('selected');
        selectedId = null;
    }

    document.getElementById('detail-view').classList.remove('visible');
    document.getElementById('list-view').style.display = '';

    // Zoom back to overview
    map.flyTo([33.72, -82.18], 8, { duration: 1.4, easeLinearity: 0.4 });
});

</script>
