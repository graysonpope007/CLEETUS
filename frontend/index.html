<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEETUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #03110D;
  --surface:    #16302B;
  --surface2:   #1c3d35;
  --claret:     #390517;
  --claret2:    #4d0820;
  --gold:       #A38560;
  --gold-dim:   rgba(163,133,96,0.18);
  --gold-rule:  rgba(163,133,96,0.4);
  --text:       #E0E0E0;
  --text-muted: #7d9089;
  --danger:     #7a1525;
}

body {
  font-family: 'Courier Prime', 'Courier New', monospace;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
  letter-spacing: 0.01em;
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */

#sidebar {
  width: 272px;
  min-width: 272px;
  background: var(--surface);
  border-right: 1px solid var(--gold-rule);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-header {
  padding: 22px 18px 16px;
  border-bottom: 1px solid var(--gold-rule);
}

#sidebar-header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.08em;
  line-height: 1;
}

#sidebar-header .rule {
  height: 1px;
  background: var(--gold-rule);
  margin: 8px 0 6px;
}

#sidebar-header p {
  font-family: 'Oswald', sans-serif;
  font-size: 0.6rem;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

#sidebar-tabs {
  display: flex;
  border-bottom: 1px solid var(--gold-rule);
}

.sidebar-tab {
  flex: 1;
  padding: 9px 4px;
  font-family: 'Oswald', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  transition: color 0.15s, border-color 0.15s;
}

.sidebar-tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

.sidebar-tab:hover:not(.active) {
  color: var(--text);
}

/* Chats tab */
#tab-chats {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

#new-chat-btn {
  margin: 12px 14px;
  padding: 9px 14px;
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold-rule);
  font-family: 'Oswald', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

#new-chat-btn:hover {
  background: var(--gold-dim);
  color: var(--gold);
}

#conversations-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 6px 8px;
}

.conv-item {
  padding: 9px 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  margin: 1px 0;
  font-family: 'Oswald', sans-serif;
  font-size: 0.78rem;
  font-weight: 400;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.04em;
  transition: color 0.1s, border-color 0.1s, background 0.1s;
}

.conv-item:hover {
  color: var(--text);
  background: var(--gold-dim);
  border-left-color: var(--gold-rule);
}

.conv-item.active {
  color: var(--gold);
  border-left-color: var(--gold);
  background: var(--gold-dim);
  font-weight: 600;
}

/* Memories tab */
#tab-memories {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

#memory-search-wrap {
  padding: 10px 12px 6px;
  border-bottom: 1px solid var(--gold-rule);
}

#memory-search {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--gold-rule);
  padding: 6px 10px;
  color: var(--text);
  font-family: 'Courier Prime', monospace;
  font-size: 0.78rem;
  outline: none;
  transition: border-color 0.15s;
}

#memory-search::placeholder { color: var(--text-muted); }
#memory-search:focus { border-color: var(--gold); }

#memories-panel {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px 12px;
}

.memory-count {
  font-family: 'Oswald', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 6px 2px 10px;
}

.memory-category { margin-bottom: 14px; }

.memory-category h3 {
  font-family: 'Oswald', sans-serif;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--gold);
  padding: 4px 0 6px;
  border-top: 1px solid var(--gold-rule);
  margin-bottom: 4px;
}

.memory-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 5px 4px;
  border-bottom: 1px solid rgba(163,133,96,0.08);
  font-size: 0.76rem;
  color: var(--text-muted);
  line-height: 1.45;
}

.memory-item:hover { background: var(--gold-dim); }

.memory-delete {
  margin-left: auto;
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 0.68rem;
  opacity: 0;
  padding: 0 2px;
  font-family: 'Oswald', sans-serif;
  letter-spacing: 0.05em;
}

.memory-item:hover .memory-delete { opacity: 1; }

/* SMS tab */
#tab-sms {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

#sms-panel {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
}

#sms-status-bar {
  font-family: 'Oswald', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 10px;
  border: 1px solid var(--gold-rule);
  margin-bottom: 8px;
}

#sms-status-bar.connected { color: #5a9a6a; border-color: rgba(90,154,106,0.4); }
#sms-status-bar.disconnected { color: var(--text-muted); }

.sms-btn {
  padding: 7px 10px;
  border: 1px solid var(--gold-rule);
  background: transparent;
  color: var(--gold);
  font-family: 'Oswald', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  width: 100%;
  margin-bottom: 6px;
  transition: background 0.1s;
}

.sms-btn:hover { background: var(--gold-dim); }

.sms-item {
  padding: 9px 8px;
  border-top: 1px solid var(--gold-rule);
  font-size: 0.76rem;
}

.sms-item .sms-from {
  font-family: 'Oswald', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text);
  margin-bottom: 3px;
  text-transform: uppercase;
}

.sms-item .sms-body { color: var(--text-muted); line-height: 1.4; }

.sms-item .sms-time {
  font-family: 'Oswald', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-top: 4px;
}

.sms-item.unread .sms-from { color: var(--gold); }

/* ── Main area ────────────────────────────────────────────────────────────── */

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#chat-header {
  padding: 14px 24px;
  border-bottom: 1px solid var(--gold-rule);
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  min-height: 52px;
}

#chat-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1rem;
  font-weight: 400;
  font-style: italic;
  color: var(--text);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#chat-title[contenteditable="true"]:focus {
  outline: none;
  border-bottom: 1px solid var(--gold);
  font-style: normal;
}

#memory-badge {
  font-family: 'Oswald', sans-serif;
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid var(--gold-rule);
  padding: 3px 9px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}

#memory-badge:hover { background: var(--gold-dim); }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── Message bubbles ─────────────────────────────────────────────────────── */

.message {
  max-width: 76%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.message.user  { align-self: flex-end; }
.message.assistant { align-self: flex-start; }

.message-bubble {
  padding: 12px 16px;
  font-family: 'Courier Prime', monospace;
  font-size: 0.875rem;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.user .message-bubble {
  background: var(--claret);
  color: var(--text);
  border-top: 2px solid var(--gold);
}

.message.assistant .message-bubble {
  background: var(--surface);
  color: var(--text);
  border-left: 3px solid var(--gold);
}

.message-time {
  font-family: 'Oswald', sans-serif;
  font-size: 0.58rem;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  text-transform: uppercase;
  padding: 0 2px;
}

.message.user .message-time { text-align: right; }

/* Typing indicator */
.typing-indicator {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 14px 16px;
}

.typing-indicator span {
  display: inline-block;
  width: 5px;
  height: 5px;
  background: var(--gold);
  animation: blink 1.3s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.22s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.44s; }

@keyframes blink {
  0%, 70%, 100% { opacity: 0.2; }
  35% { opacity: 1; }
}

/* Empty state */
#empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  padding: 60px 40px;
}

#empty-state h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.04em;
}

#empty-state .rule {
  width: 60px;
  height: 1px;
  background: var(--gold-rule);
}

#empty-state p {
  font-family: 'Courier Prime', monospace;
  font-size: 0.82rem;
  color: var(--text-muted);
  max-width: 360px;
  line-height: 1.65;
}

/* ── Input area ──────────────────────────────────────────────────────────── */

#input-area {
  padding: 14px 24px;
  border-top: 1px solid var(--gold-rule);
  background: var(--surface);
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

#message-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--gold-rule);
  padding: 10px 14px;
  color: var(--text);
  font-family: 'Courier Prime', monospace;
  font-size: 0.875rem;
  resize: none;
  max-height: 150px;
  overflow-y: auto;
  line-height: 1.5;
  outline: none;
  transition: border-color 0.15s;
}

#message-input:focus { border-color: var(--gold); }
#message-input::placeholder { color: var(--text-muted); }

#send-btn {
  width: 42px;
  height: 42px;
  background: var(--gold);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bg);
  flex-shrink: 0;
  transition: background 0.15s, opacity 0.15s;
}

#send-btn:hover { background: #b8966e; }
#send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gold-rule); }

/* ── SMS modal ───────────────────────────────────────────────────────────── */

#sms-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(3,17,13,0.8);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

#sms-modal.open { display: flex; }

#sms-modal-inner {
  background: var(--surface);
  border: 1px solid var(--gold-rule);
  padding: 28px 28px 24px;
  width: 420px;
  max-width: 92vw;
}

#sms-modal h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 6px;
}

#sms-modal .rule {
  height: 1px;
  background: var(--gold-rule);
  margin-bottom: 18px;
}

.field { margin-bottom: 14px; }

.field label {
  font-family: 'Oswald', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 5px;
}

.field input, .field textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--gold-rule);
  padding: 8px 12px;
  color: var(--text);
  font-family: 'Courier Prime', monospace;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.15s;
}

.field input:focus, .field textarea:focus { border-color: var(--gold); }
.field textarea { height: 90px; resize: none; }

.modal-btns {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
}

.modal-btns button {
  padding: 8px 20px;
  font-family: 'Oswald', sans-serif;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid var(--gold-rule);
  transition: background 0.15s;
}

.btn-cancel {
  background: transparent;
  color: var(--text-muted);
}

.btn-cancel:hover { background: var(--gold-dim); color: var(--text); }

.btn-send-confirm {
  background: var(--gold);
  color: var(--bg);
  border-color: var(--gold);
}

.btn-send-confirm:hover { background: #b8966e; }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>CLEETUS</h1>
    <div class="rule"></div>
    <p>Personal Intelligence System</p>
  </div>

  <div id="sidebar-tabs">
    <div class="sidebar-tab active" data-tab="chats">Chats</div>
    <div class="sidebar-tab" data-tab="memories">Memory</div>
    <div class="sidebar-tab" data-tab="sms">SMS</div>
  </div>

  <!-- Chats tab -->
  <div id="tab-chats">
    <button id="new-chat-btn">+ New Conversation</button>
    <div id="conversations-list"></div>
  </div>

  <!-- Memories tab -->
  <div id="tab-memories">
    <div id="memory-search-wrap">
      <input type="text" id="memory-search" placeholder="Search memories..." autocomplete="off">
    </div>
    <div id="memories-panel"></div>
  </div>

  <!-- SMS tab -->
  <div id="tab-sms">
    <div id="sms-panel">
      <div id="sms-status-bar" class="disconnected">Checking device...</div>
      <button class="sms-btn" onclick="syncSms()">Sync from phone</button>
      <button class="sms-btn" onclick="openSmsModal()">Send new SMS</button>
      <div id="sms-list"></div>
    </div>
  </div>
</div>

<!-- Main chat area -->
<div id="main">
  <div id="chat-header">
    <span id="chat-title">CLEETUS</span>
    <span id="memory-badge" onclick="switchTab('memories')">0 Memories</span>
  </div>

  <div id="messages">
    <div id="empty-state">
      <h2>CLEETUS</h2>
      <div class="rule"></div>
      <p>Your personal AI — I remember everything about you and grow sharper with every conversation. Start a new chat or select one from the left.</p>
    </div>
  </div>

  <div id="input-area">
    <textarea
      id="message-input"
      placeholder="Transmit your message..."
      rows="1"
      autofocus
    ></textarea>
    <button id="send-btn" disabled title="Send">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<!-- Send SMS modal -->
<div id="sms-modal">
  <div id="sms-modal-inner">
    <h2>Send SMS</h2>
    <div class="rule"></div>
    <div class="field">
      <label>Recipient Number</label>
      <input type="tel" id="sms-to" placeholder="+1 555 000 0000">
    </div>
    <div class="field">
      <label>Message</label>
      <textarea id="sms-body" placeholder="Compose your message..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeSmsModal()">Cancel</button>
      <button class="btn-send-confirm" onclick="confirmSendSms()">Transmit</button>
    </div>
  </div>
</div>

<script>
const API = '';
let activeConvId = null;
let isStreaming = false;

// ── Utilities ─────────────────────────────────────────────────────────────

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

// ── Tab switching ─────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.sidebar-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });

  const tabs = { chats: 'tab-chats', memories: 'tab-memories', sms: 'tab-sms' };
  Object.entries(tabs).forEach(([key, id]) => {
    const el = document.getElementById(id);
    if (key === name) {
      el.style.display = 'flex';
      el.style.flexDirection = 'column';
      el.style.flex = '1';
      el.style.overflow = 'hidden';
    } else {
      el.style.display = 'none';
    }
  });

  if (name === 'memories') loadMemories();
  if (name === 'sms') loadSms();
}

document.querySelectorAll('.sidebar-tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// ── Conversations ─────────────────────────────────────────────────────────

async function loadConversations() {
  const res = await fetch(`${API}/api/conversations`);
  const convs = await res.json();
  const list = document.getElementById('conversations-list');
  list.innerHTML = '';
  convs.forEach(c => {
    const el = document.createElement('div');
    el.className = 'conv-item' + (c.id === activeConvId ? ' active' : '');
    el.textContent = c.title;
    el.title = c.title;
    el.onclick = () => openConversation(c.id, c.title);
    list.appendChild(el);
  });
}

async function openConversation(id, title) {
  activeConvId = id;
  document.getElementById('chat-title').textContent = title;
  document.getElementById('empty-state')?.remove();
  document.getElementById('messages').innerHTML = '';

  const res = await fetch(`${API}/api/conversations/${id}/messages`);
  const msgs = await res.json();
  msgs.forEach(m => appendMessage(m.role, m.content, m.created_at));
  scrollToBottom();
  loadConversations();
  updateMemoryBadge();
}

document.getElementById('new-chat-btn').onclick = async () => {
  const res = await fetch(`${API}/api/conversations`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: 'New conversation' }),
  });
  const conv = await res.json();
  activeConvId = conv.id;
  document.getElementById('chat-title').textContent = conv.title;
  document.getElementById('messages').innerHTML = '';
  loadConversations();
  document.getElementById('message-input').focus();
};

// Inline title editing — double-click to rename
const titleEl = document.getElementById('chat-title');
titleEl.contentEditable = false;
titleEl.addEventListener('dblclick', () => {
  if (!activeConvId) return;
  titleEl.contentEditable = true;
  titleEl.focus();
});
titleEl.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    titleEl.contentEditable = false;
    await fetch(`${API}/api/conversations/${activeConvId}/title`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: titleEl.textContent.trim() }),
    });
    loadConversations();
  }
  if (e.key === 'Escape') {
    titleEl.contentEditable = false;
  }
});

// ── Messages ──────────────────────────────────────────────────────────────

function appendMessage(role, content, ts) {
  const msgs = document.getElementById('messages');
  document.getElementById('empty-state')?.remove();

  const wrap = document.createElement('div');
  wrap.className = `message ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = content;

  const time = document.createElement('div');
  time.className = 'message-time';
  time.textContent = fmtTime(ts);

  wrap.appendChild(bubble);
  wrap.appendChild(time);
  msgs.appendChild(wrap);
  return bubble;
}

function appendTypingIndicator() {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'message assistant';
  wrap.id = 'typing-indicator';
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble typing-indicator';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(bubble);
  msgs.appendChild(wrap);
  scrollToBottom();
  return bubble;
}

// ── Send message ──────────────────────────────────────────────────────────

const input = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');

input.addEventListener('input', () => {
  autoResize(input);
  sendBtn.disabled = input.value.trim() === '' || isStreaming;
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) sendMessage();
  }
});

sendBtn.onclick = sendMessage;

async function sendMessage() {
  if (!activeConvId) {
    const res = await fetch(`${API}/api/conversations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'New conversation' }),
    });
    const conv = await res.json();
    activeConvId = conv.id;
    document.getElementById('chat-title').textContent = conv.title;
    document.getElementById('messages').innerHTML = '';
    loadConversations();
  }

  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);
  sendBtn.disabled = true;
  isStreaming = true;

  appendMessage('user', text, new Date().toISOString());
  scrollToBottom();

  appendTypingIndicator();
  let assistantBubble = null;
  let fullText = '';

  try {
    const res = await fetch(`${API}/api/conversations/${activeConvId}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw) continue;
        let event;
        try { event = JSON.parse(raw); } catch { continue; }

        if (event.type === 'chunk') {
          if (!assistantBubble) {
            document.getElementById('typing-indicator')?.remove();
            const msgs = document.getElementById('messages');
            const wrap = document.createElement('div');
            wrap.className = 'message assistant';
            assistantBubble = document.createElement('div');
            assistantBubble.className = 'message-bubble';
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = fmtTime(new Date().toISOString());
            wrap.appendChild(assistantBubble);
            wrap.appendChild(time);
            msgs.appendChild(wrap);
          }
          fullText += event.text;
          assistantBubble.textContent = fullText;
          scrollToBottom();
        } else if (event.type === 'done') {
          updateMemoryBadge();
          const msgCount = document.getElementById('messages').querySelectorAll('.message').length;
          if (msgCount === 2) {
            // Give server time to auto-title, then refresh
            setTimeout(async () => {
              const r = await fetch(`${API}/api/conversations/${activeConvId}`);
              const c = await r.json();
              if (c.title && c.title !== 'New conversation') {
                document.getElementById('chat-title').textContent = c.title;
              }
              loadConversations();
            }, 2800);
          } else {
            loadConversations();
          }
        } else if (event.type === 'error') {
          document.getElementById('typing-indicator')?.remove();
          appendMessage('assistant', `Error: ${event.message}`, new Date().toISOString());
        }
      }
    }
  } catch (err) {
    document.getElementById('typing-indicator')?.remove();
    appendMessage('assistant', `Connection error: ${err.message}`, new Date().toISOString());
  }

  isStreaming = false;
  sendBtn.disabled = input.value.trim() === '';
  scrollToBottom();
}

// ── Memories ──────────────────────────────────────────────────────────────

async function updateMemoryBadge() {
  const res = await fetch(`${API}/api/memories/count`);
  const data = await res.json();
  document.getElementById('memory-badge').textContent = `${data.count} Memories`;
}

let memSearchTimer = null;
document.getElementById('memory-search').addEventListener('input', (e) => {
  clearTimeout(memSearchTimer);
  const q = e.target.value.trim();
  if (!q) { loadMemories(); return; }
  memSearchTimer = setTimeout(() => searchMemories(q), 280);
});

async function searchMemories(q) {
  const res = await fetch(`${API}/api/memories/search?q=${encodeURIComponent(q)}`);
  const mems = await res.json();
  renderMemories(mems, `${mems.length} result${mems.length !== 1 ? 's' : ''} for "${q}"`);
}

async function loadMemories() {
  const res = await fetch(`${API}/api/memories`);
  const mems = await res.json();
  renderMemories(mems, `${mems.length} memories stored`);
}

function renderMemories(mems, countLabel) {
  const panel = document.getElementById('memories-panel');
  panel.innerHTML = `<div class="memory-count">${countLabel}</div>`;

  const byCategory = {};
  mems.forEach(m => {
    if (!byCategory[m.category]) byCategory[m.category] = [];
    byCategory[m.category].push(m);
  });

  const order = ['identity', 'preference', 'goal', 'value', 'expertise', 'project', 'relationship', 'context'];
  order.forEach(cat => {
    if (!byCategory[cat]) return;
    const section = document.createElement('div');
    section.className = 'memory-category';
    const h = document.createElement('h3');
    h.textContent = cat;
    section.appendChild(h);
    byCategory[cat].forEach(m => {
      const item = document.createElement('div');
      item.className = 'memory-item';
      const text = document.createElement('span');
      text.textContent = m.content;
      const btn = document.createElement('button');
      btn.className = 'memory-delete';
      btn.textContent = 'DEL';
      btn.title = 'Delete this memory';
      btn.onclick = async () => {
        await fetch(`${API}/api/memories/${m.id}`, { method: 'DELETE' });
        loadMemories();
        updateMemoryBadge();
      };
      item.appendChild(text);
      item.appendChild(btn);
      section.appendChild(item);
    });
    panel.appendChild(section);
  });

  if (!mems.length) {
    panel.innerHTML += '<div style="font-size:0.75rem;color:var(--text-muted);padding:12px 2px;">No memories found.</div>';
  }
}

// ── SMS ───────────────────────────────────────────────────────────────────

async function loadSms() {
  const statusRes = await fetch(`${API}/api/sms/status`);
  const status = await statusRes.json();
  const bar = document.getElementById('sms-status-bar');
  if (status.connected) {
    bar.className = 'connected';
    bar.textContent = `Connected — ${status.serial || 'device'}`;
  } else {
    bar.className = 'disconnected';
    bar.textContent = status.error || 'No device connected';
  }

  const msgsRes = await fetch(`${API}/api/sms/messages?limit=30`);
  const msgs = await msgsRes.json();
  const list = document.getElementById('sms-list');
  list.innerHTML = '';

  msgs.forEach(m => {
    const el = document.createElement('div');
    el.className = 'sms-item' + (m.read === 0 && m.direction === 'incoming' ? ' unread' : '');
    const dir = m.direction === 'incoming' ? 'IN  ' : 'OUT ';
    el.innerHTML = `
      <div class="sms-from">${dir}${(m.contact_name || m.contact_number).toUpperCase()}</div>
      <div class="sms-body">${m.body.slice(0, 120)}${m.body.length > 120 ? '...' : ''}</div>
      <div class="sms-time">${fmtTime(m.timestamp)}</div>
    `;
    list.appendChild(el);
  });

  if (!msgs.length) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:0.74rem;padding:10px 2px;font-family:\'Oswald\',sans-serif;letter-spacing:0.08em;">NO MESSAGES SYNCED. CONNECT DEVICE AND TAP SYNC.</div>';
  }
}

async function syncSms() {
  const btn = document.querySelectorAll('.sms-btn')[0];
  btn.textContent = 'Syncing...';
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/api/sms/sync`, { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      btn.textContent = `Synced ${data.synced} messages`;
      setTimeout(() => { btn.textContent = 'Sync from phone'; btn.disabled = false; }, 2000);
      loadSms();
    } else {
      btn.textContent = data.error || 'Sync failed';
      setTimeout(() => { btn.textContent = 'Sync from phone'; btn.disabled = false; }, 3000);
    }
  } catch {
    btn.textContent = 'Sync failed';
    setTimeout(() => { btn.textContent = 'Sync from phone'; btn.disabled = false; }, 2000);
  }
}

function openSmsModal() {
  document.getElementById('sms-modal').classList.add('open');
}

function closeSmsModal() {
  document.getElementById('sms-modal').classList.remove('open');
  document.getElementById('sms-to').value = '';
  document.getElementById('sms-body').value = '';
}

async function confirmSendSms() {
  const to = document.getElementById('sms-to').value.trim();
  const body = document.getElementById('sms-body').value.trim();
  if (!to || !body) return alert('Please fill in both fields.');
  const res = await fetch(`${API}/api/sms/send`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to, message: body }),
  });
  const data = await res.json();
  closeSmsModal();
  alert(data.message || (data.success ? 'SMS sent.' : data.error));
}

document.getElementById('sms-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('sms-modal')) closeSmsModal();
});

// ── Init ──────────────────────────────────────────────────────────────────

async function init() {
  await loadConversations();
  await updateMemoryBadge();
}

init();
</script>
