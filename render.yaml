services:
  - type: web
    name: cleetus
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cleetus.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: claude-sonnet-4-6
      - key: EXTRACT_MODEL
        value: claude-haiku-4-5
    healthCheckPath: /
